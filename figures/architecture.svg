<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="720" viewBox="0 0 1140 720" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b45309"/>
    </marker>
    <marker id="arrowDash" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1140" height="720" fill="#ffffff"/>
  <text x="570" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">System Architecture — BNPL Credit Screener</text>

  <!-- ===== Phase bands ===== -->
  <rect x="30" y="64" width="470" height="620" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="48" y="90" font-size="15" font-weight="700" fill="#1d4ed8">① Training pipeline — offline (src/train.py)</text>

  <rect x="640" y="64" width="470" height="620" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="658" y="90" font-size="15" font-weight="700" fill="#15803d">③ Application — online (app.py on Streamlit Cloud)</text>

  <text x="570" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">② Artifacts</text>

  <!-- ===== Training boxes ===== -->
  <!-- A: data -->
  <rect x="70" y="106" width="390" height="56" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="265" y="129" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Home Credit Default Risk (Kaggle)</text>
  <text x="265" y="148" text-anchor="middle" font-size="12.5" fill="#1e3a8a">application_train.csv · 307,511 rows × 122 cols</text>

  <!-- B: clean + FE -->
  <rect x="70" y="188" width="390" height="104" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="265" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Clean + Feature engineering (src/features.py)</text>
  <text x="84" y="232" font-size="12.5" fill="#334155">• DAYS_EMPLOYED sentinel (365243) → missing</text>
  <text x="84" y="251" font-size="12.5" fill="#334155">• credit/income &amp; annuity/income ratios, loan term</text>
  <text x="84" y="270" font-size="12.5" fill="#334155">• EXT_SOURCE mean / min / max / count (thin-file signal)</text>
  <text x="84" y="285" font-size="12.5" fill="#334155">• ordinal-encode categoricals; XGBoost handles missing natively</text>

  <!-- C: split -->
  <rect x="70" y="318" width="390" height="40" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="265" y="343" text-anchor="middle" font-size="13" fill="#334155">Stratified 80 / 20 train–test split</text>

  <!-- D: three models -->
  <rect x="70" y="384" width="123" height="52" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="131" y="407" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Logistic</text>
  <text x="131" y="424" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Regression</text>
  <rect x="203" y="384" width="123" height="52" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="264" y="407" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Random</text>
  <text x="264" y="424" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Forest</text>
  <rect x="336" y="384" width="124" height="52" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="398" y="407" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">XGBoost</text>
  <text x="398" y="424" text-anchor="middle" font-size="11.5" fill="#1e3a8a">(gradient boosting)</text>

  <!-- E: evaluate -->
  <rect x="70" y="462" width="390" height="64" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="265" y="483" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Evaluate vs majority-class baseline</text>
  <text x="265" y="502" text-anchor="middle" font-size="12.5" fill="#334155">ROC-AUC · PR-AUC · calibration · thin-file subset</text>
  <text x="265" y="518" text-anchor="middle" font-size="12.5" fill="#334155">XGBoost best: ROC-AUC 0.768 (thin-file 0.748)</text>

  <!-- F: select + cost-ratio grid -->
  <rect x="70" y="552" width="390" height="84" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="265" y="574" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Select XGBoost + build cost-ratio → threshold grid</text>
  <text x="265" y="594" text-anchor="middle" font-size="12.5" fill="#334155">cost-optimal cut for each risk appetite (5:1 – 15:1),</text>
  <text x="265" y="611" text-anchor="middle" font-size="12.5" fill="#334155">for the full population and the thin-file regime</text>
  <text x="265" y="628" text-anchor="middle" font-size="11.5" fill="#64748b">(missed default costs more than a wrong rejection)</text>

  <!-- training arrows -->
  <line x1="265" y1="162" x2="265" y2="186" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="265" y1="292" x2="265" y2="316" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="265" y1="358" x2="265" y2="382" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="265" y1="436" x2="265" y2="460" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="265" y1="526" x2="265" y2="550" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===== Artifacts (middle) ===== -->
  <rect x="505" y="360" width="130" height="112" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="570" y="385" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Model</text>
  <text x="570" y="402" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">artifacts</text>
  <text x="570" y="423" text-anchor="middle" font-size="11" fill="#92400e">model_gb.joblib</text>
  <text x="570" y="438" text-anchor="middle" font-size="11" fill="#92400e">metadata.joblib</text>
  <text x="570" y="456" text-anchor="middle" font-size="10.5" fill="#b45309">+ threshold grid</text>

  <!-- F -> artifacts -->
  <path d="M460,590 C486,590 486,440 503,428" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- artifacts -> app : model to inference, grid/defaults to decision & feature row -->
  <path d="M635,402 C656,402 660,297 678,295" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrowAmber)"/>
  <path d="M635,423 C656,423 662,359 678,357" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrowAmber)"/>
  <path d="M635,445 C660,445 664,424 678,422" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrowAmber)"/>

  <!-- ===== App boxes ===== -->
  <!-- U: user -->
  <rect x="680" y="106" width="390" height="42" rx="8" fill="#dcfce7" stroke="#34d399"/>
  <text x="875" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">BNPL risk officer (end user)</text>

  <!-- G: input form -->
  <rect x="680" y="168" width="390" height="86" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="875" y="189" text-anchor="middle" font-size="13.5" font-weight="700" fill="#166534">Streamlit input form</text>
  <text x="696" y="210" font-size="12.5" fill="#166534">• applicant details (income, credit, age, …)</text>
  <text x="696" y="228" font-size="12.5" fill="#166534">• thin-file toggle — score with no external score</text>
  <text x="696" y="246" font-size="12.5" fill="#166534">• risk-appetite slider — pick the cost ratio</text>

  <!-- H: feature row -->
  <rect x="680" y="274" width="390" height="42" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="875" y="300" text-anchor="middle" font-size="13" fill="#166534">Build feature row (same feature engineering)</text>

  <!-- I: inference -->
  <rect x="680" y="336" width="390" height="42" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="875" y="362" text-anchor="middle" font-size="13" fill="#166534">XGBoost inference → default probability</text>

  <!-- J: decision -->
  <rect x="680" y="398" width="390" height="64" rx="8" fill="#dcfce7" stroke="#34d399"/>
  <text x="875" y="419" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f46">Decision vs threshold</text>
  <text x="875" y="438" text-anchor="middle" font-size="12" fill="#166534">threshold looked up from grid by risk appetite;</text>
  <text x="875" y="454" text-anchor="middle" font-size="12" fill="#166534">thin-file uses its own threshold · APPROVE / DECLINE</text>

  <!-- K: SHAP -->
  <rect x="680" y="482" width="390" height="56" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="875" y="503" text-anchor="middle" font-size="13" fill="#166534">SHAP explanation — per-decision risk drivers</text>
  <text x="875" y="521" text-anchor="middle" font-size="11.5" fill="#64748b">(external-score family shown as one contribution)</text>

  <!-- app arrows -->
  <line x1="875" y1="148" x2="875" y2="166" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="875" y1="254" x2="875" y2="272" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="875" y1="316" x2="875" y2="334" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="875" y1="378" x2="875" y2="396" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="875" y1="462" x2="875" y2="480" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- K result back to user (dashed) -->
  <path d="M1070,510 C1100,510 1100,127 1072,127" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowDash)"/>
  <text x="1104" y="320" text-anchor="middle" font-size="11.5" fill="#64748b" transform="rotate(90 1104 320)">decision + explanation shown</text>

  <text x="570" y="704" text-anchor="middle" font-size="11.5" fill="#64748b">FINS5557 Applied AI in Finance — Track A · Group project</text>
</svg>
