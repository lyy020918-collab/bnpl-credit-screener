<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="720" viewBox="0 0 1140 720" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowDash" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1140" height="720" fill="#ffffff"/>
  <text x="570" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">System Architecture — BNPL Credit Screener</text>

  <!-- ===== Phase bands ===== -->
  <rect x="30" y="64" width="470" height="620" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="48" y="90" font-size="15" font-weight="700" fill="#1d4ed8">① Training pipeline — offline (src/train.py)</text>

  <rect x="640" y="64" width="470" height="620" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="658" y="90" font-size="15" font-weight="700" fill="#15803d">③ Application — online (app.py on Streamlit Cloud)</text>

  <text x="570" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">② Artifacts</text>

  <!-- ===== Training boxes ===== -->
  <!-- A: data -->
  <rect x="70" y="106" width="390" height="60" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="265" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Home Credit Default Risk (Kaggle)</text>
  <text x="265" y="150" text-anchor="middle" font-size="12.5" fill="#1e3a8a">application_train.csv · 307,511 rows × 122 cols</text>

  <!-- B: clean + FE -->
  <rect x="70" y="194" width="390" height="104" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="265" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Clean + Feature engineering (src/features.py)</text>
  <text x="84" y="238" font-size="12.5" fill="#334155">• DAYS_EMPLOYED sentinel (365243) → missing</text>
  <text x="84" y="257" font-size="12.5" fill="#334155">• credit/income &amp; annuity/income ratios, loan term</text>
  <text x="84" y="276" font-size="12.5" fill="#334155">• EXT_SOURCE mean / min / max / count (thin-file signal)</text>
  <text x="84" y="291" font-size="12.5" fill="#334155">• ordinal-encode categoricals; impute numerics</text>

  <!-- C: split -->
  <rect x="70" y="326" width="390" height="44" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="265" y="353" text-anchor="middle" font-size="13" fill="#334155">Stratified 80 / 20 train–test split</text>

  <!-- D: three models -->
  <rect x="70" y="398" width="123" height="52" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="131" y="421" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Logistic</text>
  <text x="131" y="438" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Regression</text>
  <rect x="203" y="398" width="123" height="52" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="264" y="421" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Random</text>
  <text x="264" y="438" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Forest</text>
  <rect x="336" y="398" width="124" height="52" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="398" y="421" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">XGBoost</text>
  <text x="398" y="438" text-anchor="middle" font-size="11.5" fill="#1e3a8a">(gradient boosting)</text>

  <!-- E: evaluate -->
  <rect x="70" y="478" width="390" height="66" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="265" y="500" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Evaluate vs majority-class baseline</text>
  <text x="265" y="520" text-anchor="middle" font-size="12.5" fill="#334155">ROC-AUC · PR-AUC · calibration · thin-file subset</text>
  <text x="265" y="536" text-anchor="middle" font-size="12.5" fill="#334155">XGBoost best: ROC-AUC 0.768</text>

  <!-- F: select + threshold -->
  <rect x="70" y="572" width="390" height="62" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="265" y="595" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Select XGBoost + cost-sensitive threshold</text>
  <text x="265" y="615" text-anchor="middle" font-size="12.5" fill="#334155">(missed default costs more than a wrong rejection)</text>

  <!-- training arrows -->
  <line x1="265" y1="166" x2="265" y2="192" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="265" y1="298" x2="265" y2="324" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="265" y1="370" x2="265" y2="396" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="265" y1="450" x2="265" y2="476" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="265" y1="544" x2="265" y2="570" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===== Artifacts (middle) ===== -->
  <rect x="505" y="360" width="130" height="92" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="570" y="388" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Model</text>
  <text x="570" y="405" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">artifacts</text>
  <text x="570" y="426" text-anchor="middle" font-size="11" fill="#92400e">model_gb.joblib</text>
  <text x="570" y="441" text-anchor="middle" font-size="11" fill="#92400e">metadata.joblib</text>

  <!-- F -> artifacts -->
  <path d="M460,603 C488,603 488,430 503,418" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- artifacts -> app (to inference & feature row) -->
  <path d="M635,400 C655,400 660,338 678,338" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M635,420 C655,420 662,420 678,420" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===== App boxes ===== -->
  <!-- U: user -->
  <rect x="680" y="106" width="390" height="48" rx="8" fill="#dcfce7" stroke="#34d399"/>
  <text x="875" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">BNPL risk officer (end user)</text>

  <!-- G: input form -->
  <rect x="680" y="186" width="390" height="48" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="875" y="215" text-anchor="middle" font-size="13" fill="#166534">Streamlit input form — applicant details</text>

  <!-- H: feature row -->
  <rect x="680" y="268" width="390" height="48" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="875" y="297" text-anchor="middle" font-size="13" fill="#166534">Build feature row (same feature engineering)</text>

  <!-- I: inference -->
  <rect x="680" y="350" width="390" height="48" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="875" y="379" text-anchor="middle" font-size="13" fill="#166534">XGBoost inference → default probability</text>

  <!-- J: decision -->
  <rect x="680" y="432" width="390" height="48" rx="8" fill="#dcfce7" stroke="#34d399"/>
  <text x="875" y="455" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Decision vs threshold</text>
  <text x="875" y="472" text-anchor="middle" font-size="12.5" fill="#166534">APPROVE / DECLINE · input validation · errors handled</text>

  <!-- K: SHAP -->
  <rect x="680" y="514" width="390" height="48" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="875" y="543" text-anchor="middle" font-size="13" fill="#166534">SHAP explanation — per-decision risk drivers</text>

  <!-- app arrows -->
  <line x1="875" y1="154" x2="875" y2="184" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="875" y1="234" x2="875" y2="266" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="875" y1="316" x2="875" y2="348" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="875" y1="398" x2="875" y2="430" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="875" y1="480" x2="875" y2="512" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- K result back to user (dashed) -->
  <path d="M1070,538 C1100,538 1100,130 1070,130" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowDash)"/>
  <text x="1104" y="340" text-anchor="middle" font-size="11.5" fill="#64748b" transform="rotate(90 1104 340)">decision + explanation shown</text>

  <text x="570" y="704" text-anchor="middle" font-size="11.5" fill="#64748b">FINS5557 Applied AI in Finance — Track A · Group project</text>
</svg>
